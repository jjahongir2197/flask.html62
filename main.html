<!DOCTYPE html>
<html>
<head>
    <title>File Notes</title>
</head>
<body>

    <h1>Notes (File System)</h1>

    <form method="POST">

        <input type="text" name="note" placeholder="Write note">
        <button type="submit">Save</button>

    </form>

    <hr>

    {% for n in notes %}

        <p>{{ n }}</p>
        <hr>

    {% endfor %}

</body>
</html>
